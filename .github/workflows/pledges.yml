name: Pledge checks
on:
  pull_request:
  push:
    branches: [main, codex/post-reveal-pledges]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --check ../campaign.js
      - run: node --check ../product-media.js
      - run: node ../scripts/build-pages.mjs
      - run: npx wrangler deploy --config wrangler.toml --dry-run
      - run: npx wrangler deploy --config ../wrangler.jsonc --dry-run
